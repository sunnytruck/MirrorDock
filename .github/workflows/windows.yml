name: Windows package
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Locate WiX 3
        shell: pwsh
        run: |
          $wixBin = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin"
          if (Test-Path "$wixBin\candle.exe") { $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          elseif ($env:WIX -and (Test-Path "$env:WIX\bin\candle.exe")) { "$env:WIX\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          else { throw 'WiX 3.x is required. Install WiX and add candle.exe/light.exe to PATH.' }
      - name: Build, test and package
        run: .\gradlew.bat --no-daemon build packageWindows
      - uses: actions/upload-artifact@v4
        with:
          name: MirrorDock-Windows
          path: |
            build/installer/*.exe
            build/reports/tests/test/
